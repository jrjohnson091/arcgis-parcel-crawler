services:
  db:
    ports:
      - "5432:5432"
  backend:
    restart: "no"
    ports:
      - "8000:8000"
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - sleep
      - infinity
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov

  notebook:
  image: ${DOCKER_IMAGE?Variable not set}:${TAG-latest}
  build:
    context: ./backend
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy
      # restart: true
    prestart:
      condition: service_completed_successfully
  command:
    - sh
    - -c
    - >
      uv sync --group notebook &&
      uv run --group notebook jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --notebook-dir=/notebooks
  ports:
    - 8888:8888
  volumes:
    - ./backend:/app
    - /app/.venv
    - ./notebooks:/notebooks
